# =============================================================================
# Brand Intelligence Engine - Official Domain Database & Scoring Configuration
# =============================================================================
# Maintainable brand database for brand-impersonation detection.
# Add or edit brands WITHOUT changing Python code:
#
#   <brand_key>:
#     display_name: Human-readable organisation name
#     tokens:      Lowercase aliases detected in hostnames/paths/queries
#     official_domains: Registrable domains (PSL) owned by the organisation
#
# Domains listed here are compared by REGISTRABLE DOMAIN (Public Suffix List),
# never by raw hostname, so login.microsoft.com correctly maps to
# microsoft.com while secure-login-paypal.com does not map to paypal.com.
# =============================================================================

version: "1.0.0"

# -----------------------------------------------------------------------------
# Brand risk scoring (weights sum is capped at 1.0 after aggregation)
# -----------------------------------------------------------------------------
scoring:
  weights:
    official_domain_mismatch: 0.30   # brand referenced, registrable domain not official
    brand_token: 0.10                # brand token present anywhere in the URL
    typosquatting: 0.30              # domain label within edit distance of a brand
    homoglyph: 0.30                  # Unicode look-alike substitution of a brand
    prefix_suffix: 0.15              # secure-/login-/verify-style combinations
    cloud_hosted_brand: 0.15         # brand impersonation hosted on cloud infra
    brand_conflict: 0.35             # trusted domain references a DIFFERENT protected brand
    young_domain: 0.10               # context: domain younger than threshold
    no_ssl: 0.05                     # context: SSL absent or invalid
    whois_hidden: 0.05               # context: WHOIS privacy/redacted
    suspicious_keywords: 0.10        # context: credential-harvesting keywords
  thresholds:
    high: 0.60
    medium: 0.30
  young_domain_max_age_days: 180

# -----------------------------------------------------------------------------
# Typosquatting detection
# -----------------------------------------------------------------------------
typosquatting:
  max_edit_distance: 2       # Damerau-Levenshtein threshold
  min_brand_length: 5        # ignore very short brand tokens (fp guard)

# -----------------------------------------------------------------------------
# Misleading prefixes / suffixes combined with brand tokens
# -----------------------------------------------------------------------------
risky_affixes:
  - secure
  - login
  - signin
  - log-in
  - sign-in
  - verify
  - verification
  - support
  - help
  - helpdesk
  - auth
  - authentication
  - security
  - account
  - accounts
  - update
  - confirm
  - unlock
  - recovery
  - reset
  - service
  - services
  - center
  - centre
  - portal
  - online
  - official
  - id
  - wallet
  - pay
  - payment
  - billing
  - bank
  - banking
  - alert
  - team
  - mail
  - webmail
  - edge
  - origin
  - cdn
  - app

# Credential-collection signals (paths/queries) used for cloud-hosting context
credential_signals:
  - login
  - signin
  - sign-in
  - log-in
  - password
  - passwd
  - credential
  - verify
  - verification
  - auth
  - authenticate
  - session
  - account
  - secure
  - otp
  - webscr
  - wallet
  - billing
  - card
  - cvv
  - pin

# Public suffixes that are officially government-operated: any registrable
# domain ending in one of these is treated as official for the mapped brand.
official_suffixes:
  gov.np: government_of_nepal
  mil.np: government_of_nepal

