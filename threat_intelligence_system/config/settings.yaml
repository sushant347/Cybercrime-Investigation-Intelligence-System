# Phishing URL Detection Engine Configuration Settings

# ==============================================================================
# Decision Weights (Tuned for Hybrid Decision Engine)
# ==============================================================================
decision_weights:
  ml_probability: 0.35
  rule_engine: 0.30
  threat_intelligence: 0.20
  domain_trust_signals: 0.15

# ==============================================================================
# Ensemble Prediction Weights (Phase 3-B)
# Signals: XGBoost prob, transformer prob, rule score, threat intel, trust
# Weights of unavailable signals (e.g. transformer) are redistributed.
# ==============================================================================
ensemble_weights:
  xgboost: 0.35
  transformer: 0.20
  rules: 0.20
  threat_intelligence: 0.15
  trust: 0.10

# ==============================================================================
# 3-Class Prediction Thresholds (Composite Risk Score)
# ==============================================================================
classification_thresholds:
  legitimate_max: 30
  suspicious_max: 60
  phishing_max: 100

