name: CI

# Every suite in the repository, on every push and pull request. Before this
# existed the project had over a thousand tests that nothing ran automatically, which
# means a regression could land and stay hidden until someone happened to run
# pytest locally.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Engines, API and RAG (716 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # Each engine is its own pytest root with its own pythonpath, and each
      # bootstraps the engine upstream of it. Running them separately is what
      # proves the module boundaries hold - a cross-engine import that only
      # works because everything happens to be on one path would pass a single
      # combined run and fail here.
      - name: OCR engine
        working-directory: evidence_ocr_engine
        run: python -m pytest tests -q

      - name: Correlation engine
        working-directory: evidence_correlation_engine
        run: python -m pytest -q

      - name: Timeline and report engine
        working-directory: timeline_report_engine
        run: python -m pytest -q

      - name: API
        working-directory: ciis_api
        run: python -m pytest -q

      # The standalone suite uses in-memory retrieval and a fake generator, so
      # CI verifies its contracts without downloading Torch/model weights.
      - name: RAG assistant engine
        working-directory: rag_assistant_engine
        run: python -m pytest -q

      - name: Static analysis
        run: python scripts/lint_gate.py

      - name: Module boundaries hold
        run: python scripts/check_boundaries.py

  threat:
    name: Threat intelligence (409 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: threat_intelligence_system/requirements.txt

      # Its own job, not its own step, because this engine cannot share the
      # platform environment: PaddleOCR needs numpy<2 and this ML stack needs
      # numpy>=2. Separate runners is the CI expression of that constraint.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r threat_intelligence_system/requirements.txt

      # Trained checkpoints are not in the repository (323 MB), so this job is
      # the only place the no-checkpoint path is exercised - a developer with
      # a trained model on disk never sees it. That gap is what let a SHAP test
      # asserting a trained booster's output reach CI and fail here.
      #
      # Verified by hiding the local checkpoints and running the suite the way
      # this job does: 390 passed, 19 skipped, 0 failed. Checkpoint-dependent
      # tests skip with a stated reason rather than being deleted.
      - name: Tests (no trained checkpoints, by design)
        working-directory: threat_intelligence_system
        run: python -m pytest -q

  frontend:
    name: Frontend (87 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ciis_frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ciis_frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # The production build catches what dev mode does not - unused imports
      # that Rollup resolves differently, and anything that only fails under
      # minification.
      - name: Build
        run: npm run build
